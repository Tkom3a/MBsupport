<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{BRAND}} · вход</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root {
      --bg: #0a0c10; --panel: #12161e; --line: #262c38; --text: #d7deea;
      --muted: #8b95a8; --amber: #d7a13b; --down: #e15b64; --chip: #1d2430;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%; background:
        radial-gradient(ellipse 80% 50% at 50% -10%, #2a2214 0%, transparent 55%),
        linear-gradient(180deg, #0e1218, var(--bg));
      color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
    }
    .wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      width: 100%; max-width: 380px; background: var(--panel);
      border: 1px solid var(--line); border-radius: 12px; padding: 28px 26px 24px;
      box-shadow: 0 24px 60px #0008;
    }
    .brand { font-size: 22px; font-weight: 700; letter-spacing: 0.04em; margin: 0 0 4px; }
    .brand span { color: var(--amber); }
    .sub { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
    label { display: block; color: var(--muted); font-size: 11px; margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; }
    input {
      width: 100%; background: var(--chip); color: var(--text); border: 1px solid var(--line);
      border-radius: 7px; padding: 10px 12px; font: inherit;
    }
    input:focus { outline: none; border-color: #6a5420; }
    button {
      width: 100%; margin-top: 18px; padding: 11px 12px; border-radius: 7px; cursor: pointer;
      font: inherit; font-weight: 650; border: 1px solid #6a5420;
      background: linear-gradient(180deg, #3a2e14, #221c10); color: #ffe08a;
    }
    button:hover { border-color: var(--amber); }
    button:disabled { opacity: 0.55; cursor: wait; }
    .err { color: var(--down); font-size: 13px; min-height: 1.2em; margin-top: 12px; }
    .mode { font-size: 11px; color: var(--muted); margin-top: 14px; text-align: center; }
    .user-row.hidden, .pass-row.hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <form class="card" id="form" autocomplete="on">
      <h1 class="brand"><span>{{BRAND}}</span></h1>
      <div class="sub" id="sub">Введите учётные данные для доступа</div>
      <div class="user-row" id="userRow">
        <label for="username">Логин</label>
        <input id="username" name="username" autocomplete="username" />
      </div>
      <div class="pass-row" id="passRow">
        <label for="password" id="passLabel">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password" />
      </div>
      <button type="submit" id="btn">Войти</button>
      <div class="err" id="err"></div>
      <div class="mode">режим: {{MODE}}</div>
    </form>
  </div>
  <script>
    const mode = "{{MODE}}";
    const form = document.getElementById("form");
    const err = document.getElementById("err");
    const btn = document.getElementById("btn");
    const userRow = document.getElementById("userRow");
    const passLabel = document.getElementById("passLabel");
    const sub = document.getElementById("sub");
    if (mode === "token") {
      userRow.classList.add("hidden");
      passLabel.textContent = "Токен доступа";
      sub.textContent = "Введите WEB_TOKEN / TRADER_TOKEN";
      document.getElementById("password").required = true;
      document.getElementById("password").autofocus = true;
    } else {
      document.getElementById("username").required = true;
      document.getElementById("password").required = true;
      document.getElementById("username").autofocus = true;
    }
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      btn.disabled = true;
      try {
        const payload = mode === "token"
          ? { token: document.getElementById("password").value }
          : {
              username: document.getElementById("username").value,
              password: document.getElementById("password").value,
            };
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          err.textContent = data.error || "Ошибка входа";
          btn.disabled = false;
          return;
        }
        location.href = "/";
      } catch (ex) {
        err.textContent = String(ex.message || ex);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
