# ShotCore — соседнее ядро рядом с MTCore.
# Только публичный рынок OKX, ордера не выставляет.
# Фильтры по умолчанию сняты с живых Shots Group в профиле OKXoma.

exchange:
  rest: https://www.okx.com
  ws_public: wss://ws.okx.com:8443/ws/v5/public
  inst_type: SWAP
  quote: USDT

# Пустой whitelist = все SWAP-USDT, прошедшие фильтры (как Market Live у MT).
# Если заполнить — ядро смотрит только эти пары (формат OKX: BTC-USDT-SWAP).
market:
  whitelist: []
  blacklist: []
  refresh_sec: 15
  ws_batch_size: 80
  symbols_per_connection: 180

filters:
  qav_24h_min: 5000000
  qav_24h_max: 2000000000
  tick_size_pct_max: 0.25
  mark_dev_pct_max: 2.0
  min_leverage: 20
  max_leverage: 100

# Прострел как в MoonTrader: тики 0.5–0.7 с (1–2 тика на графике),
# % = (экстремум − исходная цена до импульса) / исходная.
# Рекомендация дистанции = типичный прострел − suggest_inside_pct (1.50 → 1.45).
shot:
  windows_ms: [500, 700, 1200]
  min_percent: 0.80
  min_trades: 2
  min_quote_volume: 200
  cooldown_ms: 2500
  recover_ratio: 0.35
  hold_ms: 300
  refractory_ms: 1000
  distance_levels: [1.11, 1.32, 1.42, 1.63, 1.78]
  vplus_min_pnl: 0.3
  tp_min_pct: 0.3
  suggest_inside_pct: 0.05

# Как «Фильтр активных рынков» в MoonTrader: 1ч Δ + 15м оΔ,
# сортировка каждые 15 с, выкинуть первые 2, взять 25.
active:
  max_markets: 25
  ignore_first: 2
  sort_sec: 15
  filter_1h_delta: true
  filter_15m_open_delta: true

# Как deltaFilterList в MT: BTC-USDT-SWAP, 60с, ±0.6%.
# Ядро пишет ВСЕ прострелы, поле btc_calm показывает, прошёл бы фильтр MT.
btc_filter:
  symbol: BTC-USDT-SWAP
  window_sec: 60
  range_pct: 0.6

output:
  dir: data
  csv_name: shots.csv
  jsonl_name: shots.jsonl
  hints_name: distance_hints.csv
  retain_hours: 48
  cleanup_sec: 3600

web:
  host: 0.0.0.0
  port: 4861
  timezone: Europe/Moscow
  stats_lookback_min: 1440
